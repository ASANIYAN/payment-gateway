version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: payment-gateway-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d # Auto-run migrations on first start

  app:
    build: .
    container_name: payment-gateway-app
    environment:
      DATABASE_URL: postgresql://postgres:0000@postgres:5432/payment_gateway
      BANK_API_URL: http://host.docker.internal:8787
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
